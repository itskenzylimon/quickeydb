name: quickeydb
description: QuickeyDB is a simple ORM inspired from ActiveRecord, built on-top of Sqflite.

homepage: https://github.com/itskenzylimon/quickey

version: 1.2.1+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Mobile SQLite
  sqflite: ^2.3.0

  # Desktop SQLite
  sqflite_common_ffi: ^2.3.0+2

  # Web SQLite (WASM)
  sqlite3: ^3.1.0

  # Optional but common
  path_provider: ^2.0.15
  collection: ^1.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.2

  flutter_lints: ^2.0.3