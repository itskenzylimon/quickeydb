name: example
description: Material feature gallery for QuickeyDB CRUD, queries and encrypted storage.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  activity:
    path: ../../Activity
  quickeydb:
    path: ../
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  sqflite_common_ffi_web: ">=0.3.0 <2.0.0"
  path_provider: ^2.0.15
  sqflite_common: ^2.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/quickeydb.png
